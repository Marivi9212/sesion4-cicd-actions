name: Crear rama al modificar tests

on:
  push:
    branches:
      - main
    paths:
      - 'tests/**'
      - 'test/**'
      - '**/*test*'
      - '**/*spec*'

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Crear nombre de rama
        id: vars
        run: |
          BRANCH_NAME="auto/test-change-${GITHUB_SHA::7}-$(date +%Y%m%d%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Crear nueva rama desde el commit actual
        run: |
          git checkout -b "${{ steps.vars.outputs.branch_name }}"

      - name: Verificar cambios de test presentes en el commit
        run: |
          git diff-tree --no-commit-id --name-only -r $GITHUB_SHA

      - name: Push de la nueva rama
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "${{ steps.vars.outputs.branch_name }}"